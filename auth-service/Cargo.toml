[package]
name = "auth-service"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
axum = { version = "0.8.6", features = ["macros"] }
axum-extra = { version = "0.10.3", features = ["cookie"] }
tokio = { version = "1.47.1", features = ["full"] }
tower-http = { version = "0.6.6", features = ["fs", "cors", "trace"] }
reqwest = { version = "0.12.24", default-features = false, features = ["json", "rustls-tls", "cookies"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
jsonwebtoken = { version ="10.1.0", features = ["rust_crypto"] }
uuid = { version = "1.7.0", features = ["v4", "serde"] }
async-trait = "0.1.89"
validator = { version = "0.20.0", features = ["derive"] }
dotenvy = "0.15.7"
lazy_static = "1.5.0"
chrono = "0.4.42"
rand = "0.8.5"
sqlx = { version = "0.8", features = [ "runtime-tokio-rustls", "postgres", "migrate"] }
argon2 = { version = "0.5.3", features = ["std"] }
cleanup_db_macro = { path = "./cleanup_db_macro" }
redis = { version = "0.32.7", features = ["tokio-comp"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["registry", "env-filter"] }
thiserror = "2.0.17"
color-eyre = "0.6.5"
tracing-error = "0.2.1"
secrecy = { version = "0.8.0", features = ["serde"] }


[dev-dependencies]
reqwest = { version = "0.12.24", default-features = false, features = ["json", "cookies"] }
fake = { version = "4.4.0", features = ["derive"] }
quickcheck = "1.0.3"
quickcheck_macros = "1.1.0"
wiremock = "0.6.0"
